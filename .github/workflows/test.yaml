pipeline {
    agent any

    tools {
        jdk 'java'
        maven 'maven'
    }

    stages {

        stage('Git Checkout') {
            steps {
                git branch: 'main',
                    url: 'https://github.com/harikrishnaps259-alt/demo-action.git'
            }
        }

        stage('Compile') {
            steps {
                bat 'mvn clean compile'
            }
        }

        stage('Build') {
            steps {
                bat 'mvn package'
            }
        }

        stage('Docker Build and Push') {
            steps {
                script {
                    def dockerImage = 'haritokyo/demo1-nginx'
                    def dockerTag = 'latest'

                    withCredentials([
                        usernamePassword(
                            credentialsId: 'doc-ID',
                            usernameVariable: 'DOCKER_USER',
                            passwordVariable: 'DOCKER_PASS'
                        )
                    ]) {
                        bat 'echo %DOCKER_PASS% | docker login -u %DOCKER_USER% --password-stdin'
                    }

                    bat "docker build -t ${dockerImage}:${dockerTag} ."

                    bat "docker push ${dockerImage}:${dockerTag}"
                }
            }
        }

        stage('Deploy Application') {
            steps {
                script {
                    def dockerImage = 'haritokyo/demo1-nginx'
                    def dockerTag = 'latest'

                    bat '''
                    docker stop maven-app || exit /b 0
                    docker rm maven-app || exit /b 0
                    '''

                    bat "docker pull ${dockerImage}:${dockerTag}"

                    bat "docker run -d -p 8001:8001 --name maven-app ${dockerImage}:${dockerTag}"
                }
            }
        }
    }
}
